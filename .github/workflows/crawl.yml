name: Update shelves
on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:
    inputs:
      max_pages:
        description: Pages per media group, for a quick test
        required: false
  push:
    branches: [main]
    paths: ["libraries.json", "readers/**", "site/**", "tools/crawl.mjs"]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/crawl.mjs
        env:
          MAX_PAGES: ${{ inputs.max_pages }}
          CHECK_MINUTES: 180
          MAX_MINUTES: 230
      - run: node --max-old-space-size=6000 tools/enrich.mjs
      - run: node tools/posters.mjs
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      - run: node tools/seo.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
