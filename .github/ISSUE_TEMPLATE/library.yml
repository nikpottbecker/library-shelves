name: Bücherei vorschlagen / Suggest a library
description: Deine Bücherei fehlt? / Your library is missing?
labels: [library-request]
body:
  - type: input
    id: name
    attributes:
      label: Name und Ort / Name and town
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Link zum Online-Katalog / Catalog link
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Katalogsystem, falls bekannt / Catalog system, if known
