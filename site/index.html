<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Library Shelves</title>
<style>
/* Layout: ein Regal aus Hüllen. Links das Cover, unten die Signatur wie auf einem Bibliotheksetikett. */
:root {
  --bg: #e6ecec; --panel: #f6f9f8; --ink: #14303c; --muted: #4d6670; --line: #bccaca;
  --accent: #0b6e69; --accent-ink: #ffffff; --stamp: #b3261e; --spine: #cfdbda;
  --display: "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f2028; --panel: #17303a; --ink: #e8f1f0; --muted: #a2b8bd; --line: #2d4a55;
  --accent: #52c7bd; --accent-ink: #06211f; --stamp: #ff9d94; --spine: #234350; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f2028; --panel: #17303a; --ink: #e8f1f0; --muted: #a2b8bd; --line: #2d4a55;
  --accent: #52c7bd; --accent-ink: #06211f; --stamp: #ff9d94; --spine: #234350; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body); }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 22px; }
h1 { font: 800 clamp(2.3rem, 7vw, 4.6rem)/1 var(--display); margin: 0; letter-spacing: -.02em; text-wrap: balance; }
.lead { margin: 10px 0 0; color: var(--muted); max-width: 62ch; }
.tabs, .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.tabs button { font: 700 1rem var(--body); padding: 9px 16px; border-radius: 4px; border: 1px solid var(--line);
  background: transparent; color: var(--ink); cursor: pointer; }
.tabs button span { font: 500 .8rem var(--mono); color: var(--muted); margin-left: 4px; }
.tabs button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tabs button[aria-pressed="true"] span { color: inherit; }
.bar input[type=search], .bar select { font: 400 1rem var(--body); color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 4px; padding: 9px 12px; min-width: 0; }
.bar input[type=search] { flex: 1 1 240px; }
.bar label { display: inline-flex; gap: 7px; align-items: center; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.count { color: var(--muted); font: 500 .85rem var(--mono); }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 22px 16px; }
.card { display: grid; align-content: start; gap: 6px; min-width: 0; }
.wrapcover { position: relative; }
.cover { aspect-ratio: 2/3; max-width: 100%; color: inherit; text-decoration: none; background: var(--spine); border-radius: 3px; overflow: hidden; position: relative;
  display: flex; align-items: flex-start; padding: 12px 12px 36px; }
.cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cover b { font: 800 1.15rem/1.12 var(--display); overflow-wrap: anywhere; }
.cover:hover { outline: 2px solid var(--accent); }
.rate { position: absolute; left: 8px; bottom: 8px; padding: 1px 6px; border-radius: 3px; background: var(--accent); color: var(--accent-ink); font: 700 .82rem var(--body); }
.links { display: flex; gap: 12px; font-size: .85rem; }
.links a { color: var(--accent); }
.stamp { position: absolute; top: 12px; left: 8px; transform: rotate(-7deg); padding: 2px 7px; font: 500 .72rem var(--mono);
  letter-spacing: .08em; color: var(--stamp); background: var(--panel); border: 2px solid var(--stamp); border-radius: 3px; z-index: 1; }
.fav { position: absolute; top: 6px; right: 6px; width: 34px; height: 34px; border: 0; border-radius: 3px; background: var(--panel);
  color: var(--muted); font-size: 1.05rem; cursor: pointer; z-index: 2; }
.fav[aria-pressed="true"] { color: var(--stamp); }
.t { font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
.m { color: var(--muted); font-size: .88rem; }
.sig { font: 500 .72rem var(--mono); color: var(--muted); }
.more { justify-self: center; font: 700 1rem var(--body); padding: 10px 22px; border-radius: 4px; border: 1px solid var(--accent);
  background: transparent; color: var(--accent); cursor: pointer; }
.libs { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.lib { display: flex; justify-content: space-between; gap: 12px; padding: 14px; background: var(--panel); border-radius: 4px; color: inherit; text-decoration: none; }
.lib:hover { outline: 2px solid var(--accent); }
.empty { padding: 40px 0; color: var(--muted); }
footer { border-top: 1px solid var(--line); padding-top: 18px; display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); color: var(--muted); font-size: .92rem; }
footer h2 { font: 800 1.05rem var(--display); color: var(--ink); margin: 0 0 4px; }
footer p { margin: 0; }
footer a { color: var(--accent); }
.hours { display: grid; grid-template-columns: auto 1fr; gap: 0 12px; margin: 0; }
.hours dd { margin: 0; font-variant-numeric: tabular-nums; }
</style></head><body>
<div class="wrap">
  <header>
    <h1 id="name">Library Shelves</h1>
    <p class="lead"><span id="lead">Filme und Spiele deiner Bücherei auf einem Regal.</span></p>
  </header>
  <nav class="tabs" id="tabs" aria-label="Bereich"></nav>
  <div class="bar">
    <input type="search" id="q" placeholder="Titel oder Reihe suchen" aria-label="Titel oder Reihe suchen">
    <select id="sort" aria-label="Sortierung">
      <option value="top">Beste Bewertung</option>
      <option value="new">Zuletzt angeschafft</option>
      <option value="az">A bis Z</option>
      <option value="yd">Neuestes Jahr</option>
      <option value="ya">Ältestes Jahr</option>
    </select>
    <select id="genre" aria-label="Genre"><option value="">Alle Genres</option></select>
    <label><input type="checkbox" id="only"> Nur verfügbar</label>
  </div>
  <div class="count" id="count" aria-live="polite"></div>
  <main class="shelf" id="shelf"></main>
  <button class="more" id="more" hidden>Mehr anzeigen</button>
  <footer>
        <div class="data"><h2>Stand der Daten</h2><p id="stand"></p><p><a id="catalog" href="#">Zum Katalog der Bücherei</a></p><p>Freies Projekt, kein Angebot der Bücherei. <a href="https://github.com/nikpottbecker/library-shelves">Deine Bücherei ergänzen</a></p></div>
    <div><h2>Rechtliches</h2><p><a href="impressum.html">Impressum</a> · <a href="datenschutz.html">Datenschutz</a></p><p>Information courtesy of IMDb (https://www.imdb.com). Used with permission.</p></div>
  </footer>
</div>
<script>
const lib = new URLSearchParams(location.search).get("lib");
let DATA, CAT = "";
const TABS = [["d", "DVD"], ["b", "Blu-ray"], ["g", "Spiele"], ["fav", "Merkliste"]];
const PAGE = 60;
const GENRES = { Action: "Action", Adventure: "Abenteuer", Animation: "Animation", Biography: "Biografie", Comedy: "Komödie", Crime: "Krimi", Documentary: "Doku", Drama: "Drama", Family: "Familie", Fantasy: "Fantasy", History: "Historie", Horror: "Horror", Music: "Musik", Musical: "Musical", Mystery: "Mystery", Romance: "Liebesfilm", "Sci-Fi": "Science-Fiction", Sport: "Sport", Thriller: "Thriller", War: "Krieg", Western: "Western" };
const $ = id => document.getElementById(id);
const key = "fav:" + (lib || "");
const store = {
  get() { try { return new Set(JSON.parse(localStorage.getItem(key) || "[]")); } catch { return new Set(); } },
  set(s) { try { localStorage.setItem(key, JSON.stringify([...s])); } catch {} }
};
let favs = store.get(), tab = "d", shown = PAGE;

function list() {
  const q = $("q").value.trim().toLowerCase(), only = $("only").checked, s = $("sort").value, genre = $("genre").value;
  const r = DATA.items.filter(x => (tab === "fav" ? favs.has(x.id) : x.f === tab)
    && (!genre || x.genres?.includes(genre)) && (!only || x.avail) && (!q || (x.title + " " + (x.sub || "")).toLowerCase().includes(q)));
  const by = {
    top: (a, b) => (b.rating || 0) - (a.rating || 0) || (b.votes || 0) - (a.votes || 0),
    new: (a, b) => b.id.localeCompare(a.id),
    az: (a, b) => a.title.localeCompare(b.title, "de"),
    yd: (a, b) => (b.disc || 0) - (a.disc || 0),
    ya: (a, b) => (a.disc || 9999) - (b.disc || 9999)
  };
  return r.sort(by[s]);
}
function link(text, href) {
  const a = document.createElement("a");
  a.textContent = text; a.href = href; a.target = "_blank"; a.rel = "noopener";
  return a;
}
function card(x) {
  const c = document.createElement("article"); c.className = "card";
  const cover = link("", CAT.replace("{id}", encodeURIComponent(x.id))); cover.className = "cover";
  const b = document.createElement("b"); b.textContent = x.title; cover.append(b);
  if (x.rating) { const r = document.createElement("span"); r.className = "rate"; r.textContent = "★ " + x.rating.toFixed(1).replace(".", ","); cover.append(r); }
  if (!x.avail) { const s = document.createElement("span"); s.className = "stamp"; s.textContent = "ENTLIEHEN"; cover.append(s); }
  const f = document.createElement("button");
  f.className = "fav"; f.textContent = "♥"; f.setAttribute("aria-pressed", favs.has(x.id));
  f.setAttribute("aria-label", x.title + " auf die Merkliste");
  f.onclick = () => { favs.has(x.id) ? favs.delete(x.id) : favs.add(x.id); store.set(favs); render(); };
  const box = document.createElement("div"); box.className = "wrapcover"; box.append(cover, f);
  const m = document.createElement("div"); m.className = "m";
  m.textContent = [x.year || x.disc, x.plat, ...(x.genres || []).slice(0, 2).map(g => GENRES[g] || g)].filter(Boolean).join(" · ");
  const links = document.createElement("div"); links.className = "links";
  if (x.imdb) links.append(link("IMDb", "https://www.imdb.com/title/" + x.imdb + "/"));
  if (x.f !== "g") links.append(link("Trailer", "https://www.youtube.com/results?search_query=" + encodeURIComponent(x.title + " Trailer deutsch")));
  c.append(box, m, links);
  return c;
}
function render() {
  const r = list();
  $("tabs").replaceChildren(...TABS.map(([k, n]) => {
    const b = document.createElement("button");
    const c = k === "fav" ? favs.size : DATA.items.filter(x => x.f === k).length;
    b.textContent = n; const sp = document.createElement("span"); sp.textContent = c; b.append(sp);
    b.setAttribute("aria-pressed", k === tab);
    b.onclick = () => { tab = k; shown = PAGE; render(); };
    return b;
  }));
  $("count").textContent = r.length + (r.length === 1 ? " Titel" : " Titel") + ", " + r.filter(x => x.avail).length + " verfügbar";
  $("shelf").replaceChildren(...r.slice(0, shown).map(card));
  if (!r.length) { const p = document.createElement("p"); p.className = "empty"; p.textContent = tab === "fav" ? "Noch nichts gemerkt. Tippe auf das Herz an einem Titel." : "Kein Titel passt. Ändere die Suche oder den Filter."; $("shelf").append(p); }
  $("more").hidden = shown >= r.length;
}
$("more").onclick = () => { shown += PAGE; render(); };
["q", "sort", "genre", "only"].forEach(i => $(i).addEventListener("input", () => { if (DATA) { shown = PAGE; render(); } }));
async function start() {
  if (!lib) {
    const all = await (await fetch("shelves/index.json")).json();
    const titles = all.reduce((n, l) => n + l.total, 0);
    $("lead").textContent = `${titles.toLocaleString("de-DE")} Filme und Spiele aus ${all.length} Büchereien. Wähle deine Bücherei.`;
    document.querySelectorAll("#tabs,#sort,#genre,label,#count,.data").forEach(e => e.hidden = true);
    $("q").placeholder = "Bücherei oder Ort suchen"; $("q").setAttribute("aria-label", "Bücherei oder Ort suchen");
    $("shelf").className = "libs";
    const show = () => {
      const q = $("q").value.trim().toLowerCase();
      $("shelf").replaceChildren(...all.filter(l => (l.name + " " + l.town).toLowerCase().includes(q)).map(l => {
        const a = document.createElement("a"); a.href = "?lib=" + encodeURIComponent(l.id); a.className = "lib";
        const n = document.createElement("span"); n.className = "t"; n.textContent = l.name;
        const c = document.createElement("span"); c.className = "m"; c.textContent = `${l.total.toLocaleString("de-DE")} Titel`;
        a.append(n, c); return a;
      }));
    };
    $("q").addEventListener("input", show); show();
    return;
  }
  DATA = await (await fetch(`shelves/${encodeURIComponent(lib)}.json`)).json();
  CAT = DATA.rec; $("name").textContent = DATA.name; $("catalog").href = DATA.url; document.title = DATA.name;
  const used = new Set(DATA.items.flatMap(x => x.genres || []));
  for (const g of Object.keys(GENRES)) if (used.has(g)) $("genre").add(new Option(GENRES[g], g));
  if (!DATA.items.some(x => x.rating)) $("sort").value = "new";
  $("lead").textContent = "Tippe auf einen Titel, um ihn im Katalog der Bücherei zu öffnen.";
  $("stand").textContent = "Bestand und Verfügbarkeit vom " + new Date(DATA.finished).toLocaleString("de-DE") + ". Vor dem Weg zur Bücherei im Katalog prüfen.";
  render();
}
start().catch(() => { $("lead").textContent = "Diese Bücherei wurde nicht gefunden."; });
</script>
</body></html>
